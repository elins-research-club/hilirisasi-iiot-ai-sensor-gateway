[identity]
gateway_id = "iiotgw"
default_room_id = "room_unassigned"

[pipeline]
buffer_max_size = 2048
validation_state_max_entries = 100000
resample_interval_sec = 60
window_size = 12
window_step = 1
min_valid_ratio = 0.75
node_silent_after_sec = 180
sequence_gap_warn = true

[contract]
allow_legacy_v1 = true
data_topic = "iot/{gateway_id}/data"
status_topic = "iot/{gateway_id}/status/sensor"

[preprocessing]
version = "gateway_preprocess.v1"
apply_to_v2 = false
state_max_entries = 100000

[preprocessing.filters.temperature_c]
kind = "none"

[preprocessing.filters.humidity_pct]
kind = "none"

[preprocessing.filters.co_ppm]
kind = "none"

[preprocessing.filters.co2_ppm]
kind = "none"

[receiver]
rotate_max_bytes = 10485760
serial_idle_sleep_sec = 0.05
reconnect_initial_sec = 0.5
reconnect_max_sec = 30.0

[chirpstack]
enabled = true
host = "127.0.0.1"
port = 1883
topic = "application/+/device/+/event/up"
client_id = "iiot-ai-sensor-iiotgw"
keepalive = 30
queue_max = 4096
reconnect_min_sec = 1
reconnect_max_sec = 30
allow_dev_eui = ["737fa3925c5c2bba", "e02d6ee6c5f39cfd"]
username_env = "IIOT_CHIRPSTACK_USER"
password_env = "IIOT_CHIRPSTACK_PASS"

[chirpstack.room_by_dev_eui]
"737fa3925c5c2bba" = "room_unassigned"
"e02d6ee6c5f39cfd" = "room_unassigned"

[live_runtime]
# Promotion order: shadow_ingest -> shadow_ai -> publish_ai.
mode = "shadow_ingest"
output_dir = "/home/iiotgw/.local/state/iiot-ai-sensor-gateway"
rotate_max_bytes = 10485760
anomaly_enabled = true
anomaly_warmup_samples = 64
anomaly_threshold = 0.7
config_version = "iiotgw-live-2026-09-25"

[publisher]
enabled = false
host = "100.95.51.126"
port = 1883
client_id = "iiot-ai-sensor-iiotgw-publisher"
keepalive = 30
qos = 1
publish_timeout_sec = 10.0
reconnect_min_sec = 1
reconnect_max_sec = 30
outbox_path = "/home/iiotgw/.local/state/iiot-ai-sensor-gateway/outbox.sqlite3"
outbox_max_entries = 10000
username_env = "IIOT_PUBLISH_USER"
password_env = "IIOT_PUBLISH_PASS"

[forecast_runtime]
enabled = false
manifest_path = "deployment/model-manifests/co2_fits_pi5_20260828.json"
target_node_id = "737fa3925c5c2bba"
cadence_tolerance_fraction = 0.20

[normalization]
method = "minmax"

[normalization.minmax]
temperature_c = [-10.0, 80.0]
humidity_pct = [0.0, 100.0]
pressure_hpa = [800.0, 1200.0]
bme_gas_ohm = [100.0, 10000000.0]
co_ppm = [0.0, 1000.0]
no2_raw_mv = [0.0, 3300.0]
no2_ratio = [0.0, 20.0]
o3_ppm = [0.0, 10.0]
co2_ppm = [0.0, 10000.0]
pm1_ug_m3 = [0.0, 5000.0]
pm25_ug_m3 = [0.0, 5000.0]
pm10_ug_m3 = [0.0, 5000.0]
battery_voltage = [0.0, 60.0]
current_ma = [-20000.0, 20000.0]
power_mw = [-1000000.0, 1000000.0]
voc_raw = [0.0, 5000.0]
bme_gas_raw = [0.0, 50000.0]
co_raw = [0.0, 1.0]
gas_raw = [0.0, 50000.0]

[validation.ranges]
temperature_c = [-10.0, 80.0]
humidity_pct = [0.0, 100.0]
pressure_hpa = [800.0, 1200.0]
bme_gas_ohm = [100.0, 10000000.0]
co_ppm = [0.0, 1000.0]
no2_raw_mv = [0.0, 3300.0]
no2_ratio = [0.0, 20.0]
o3_ppm = [0.0, 10.0]
co2_ppm = [0.0, 10000.0]
pm1_ug_m3 = [0.0, 5000.0]
pm25_ug_m3 = [0.0, 5000.0]
pm10_ug_m3 = [0.0, 5000.0]
battery_voltage = [0.0, 60.0]
current_ma = [-20000.0, 20000.0]
power_mw = [-1000000.0, 1000000.0]
voc_raw = [0.0, 5000.0]
bme_gas_raw = [0.0, 5000.0]
co_raw = [0.0, 0.05]
gas_raw = [0.0, 5000.0]
