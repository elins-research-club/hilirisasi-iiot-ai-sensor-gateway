[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D IIOT_USE_MOCK_SENSORS=1

; Hardware integration notes:
; - Set IIOT_USE_MOCK_SENSORS=0 after wiring BME688/BME668 and SEN0377.
; - Node ID and room ID defaults live in include/config.h.
; - Ebyte E32 is driven through UART in this skeleton.