[platformio]
default_envs = mock

[env]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
; PlatformIO 7.0.1 propagates this C++-only flag to locally installed C
; libraries. Bosch's official bme68x.c is auto-discovered in every environment
; once present under lib/, so remove the flag at the shared base env.
build_unflags =
    -fuse-cxa-atexit

[env:mock]
build_flags =
    -D IIOT_USE_MOCK_SENSORS=1
board_build.esp-idf.sdkconfig_path = sdkconfig.mock.generated
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.mock.defaults"
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

[env:hardware]
build_flags =
    -D IIOT_USE_MOCK_SENSORS=0
board_build.esp-idf.sdkconfig_path = sdkconfig.hardware.generated
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.hardware.defaults"
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

[env:hardware-bme68x]
extends = env:hardware
build_flags =
    -D IIOT_USE_MOCK_SENSORS=0
    -D IIOT_ENABLE_BOSCH_BME68X=1

; The hardware profile is a compile/provisioning gate, not proof of connected sensors.
; Production UART allocation is frozen to E32 on UART1 plus an external dual-UART
; bridge for MH-Z19B/C and PMS7003T. The assembled PCB and 5 V rails must be verified.
